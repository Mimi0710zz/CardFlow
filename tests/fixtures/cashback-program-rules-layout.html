<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="../../styles.css">
  <title>Cashback program rules layout fixture</title>
</head>
<body>
  <section class="modal-card cashback-program-modal">
    <div class="cashback-program-form">
      <h3 class="cashback-section-title">ĐIỀU KIỆN TOÀN CHƯƠNG TRÌNH</h3>
      <div class="cashback-program-rules">
        <label class="field">Tổng chi tối thiểu<input value="5.000.000"></label>
        <label class="field">Max cashback toàn kỳ<input value="600.000"></label>
        <label class="check-field"><input type="checkbox"><span>Có sử dụng Gói hoàn tiền</span></label>
        <label class="field">Số lần đổi gói tối đa<input value="1"></label>
      </div>
    </div>
  </section>
</body>
</html>
